        - '(?<![一-龥々])(前の|今の|同じ|別の|どの|公式の|この|その|元の|新しい|古い|次の|有効にした|入れた|足した|直した|分けた|全部入りの|最終の|ふつうの|標準の)形(?![一-龥々])'
        - '(する|した|せる|ける|える|れる|ない|できる|う)形(に|で|です|だ|の|が|は|を|のまま)'
      exclude: [という形, といった形, と言う形]
    why: 構成、方式、手順、版、状態のどれを指しているのかを「形」でまとめている。
    suggest: [構成, 方式, 手順, バージョン, 状態, 書き方]
    keep_when: [図形や見た目の形, 「〜という形で」のように話し言葉として定着した言い方]
    examples:
      - bad: 前の形に戻す。
        good: 変更前の構成に戻す。
      - bad: 有効にした形でも、応答は同じだった。
        good: この設定を有効にしても、応答は同じだった。
      - bad: 1 組を順番に使う形のまま進めます。
        good: 1 組を順番に使う方式のまま進めます。

  - id: sou
    term: 層
    yomi: そう
    category: metaphor-noun
    severity: warn
    evidence: {survey: 2026-11, ai: 5.63, human2021: 4.24, qiita2026: 17.57, note: '人2021 の当たりの多くは機械学習の層と人の層。AI の文章では定着していない複合語（テナント層、MCP 層）と動詞で説明する形が多い'}
    match:
      literal: [層]
      exclude: [階層, 深層, 表層, 地層, 断層, 成層, 層別, 層状, 高層, 一層, 重層, 多層防御, 上層部, 下層階級, 層目, 年齢層, 世代層, 利用者層, 顧客層, ユーザー層, 読者層, 若年層, 富裕層, 経営層, 管理職層, マネージャー層, 得意層, 苦手層, 見習い層, 現場層, トップ層, 上位層]
      exclude_regex:
        - '(サービス|アプリケーション|アプリ|プレゼンテーション|ドメイン|インフラストラクチャ|インフラ|データアクセス|ビジネスロジック|永続化|ユースケース|リポジトリ|コントローラー?|ストレージ)\s?層'
        - '(ネットワーク|トランスポート|データリンク|物理|セッション|中間|隠れ|出力|入力|全結合|畳み込み|プーリング|正規化|ノーマライゼーション|埋め込み|最終|Attention|Conv)\s?層'
        - '(?i:domain|usecase|use ?case|infra|infrastructure|repository|controller|service|presentation|application|ui|view|model|persistence|adapters?|ports?|handler|interface)\s?層'
        - '[0-9０-９二三四五六七八九十N]+\s?層(構造|構成|アーキテクチャ|システム|の(MLP|ニューラル|CNN|全結合|LSTM))'
        - '(第[0-9０-９一二三四五六七]+|L[1-7])\s?層'
    why: layer の直訳で、処理や部品を何でも「層」と呼んでいる。「API 層」「テナント層」「検証層」のような、定着していない複合語や、「〜を担う層」「〜を限る層」のように動詞で説明する形は、何がどこで何をするのかが分からない。
    suggest: [〇〇サーバー, 〇〇の処理, 〇〇を行う関数・モジュール, 〇〇の前に置くプロキシ, レイヤー（定着した文脈のとき）]
    keep_when: [サービス層・ドメイン層など、レイヤードアーキテクチャの定着した層の名前, OSI 参照モデルの層, ニューラルネットワークの層, 階層・深層・年齢層などの定着した語]
    examples:
      - bad: API 層でトークンを検証する。
        good: API サーバーがリクエストを受け取ったときにトークンを検証する。
      - bad: 既存の認証を残したまま OAuth 層だけ被せる。
        good: 既存の認証を残したまま、OAuth の認可サーバーだけを前に置く。
      - bad: DB ロールは被害を限る層として使う。
        good: DB ロールで、乗っ取られたときに読み書きできる範囲を限る。

