  # ---- 硬い漢語（stiff-kango）----
  - id: tanpo
    term: 担保
    yomi: たんぽ
    category: stiff-kango
    severity: warn
    evidence: {survey: 2026-11, ai: 1.2, human2021: 1.43, qiita2026: 3.19}
    match:
      literal: [担保]
    why: 「品質を担保する」は何をすれば品質が保たれるのかが書かれない。言い換えるときは、確保か保証かで強さが変わる点に注意する。
    suggest: [確保する, 保証する, 〜で確かめる]
    keep_when: [金融・法律の担保]
    examples:
      - bad: テストで品質を担保する。
        good: リリース前に全テストを通して、既存の機能が壊れていないことを確かめる。

  - id: kitei
    term: 既定
    yomi: きてい
    category: stiff-kango
    severity: info
    evidence: {survey: 2026-11, ai: 65.84, human2021: 0.81, qiita2026: 4.64, note: 'Qiita 7万件調査（nyosegawa, 2026-09）の記事割合 既定 0.5%→7.1%'}
    match:
      literal: [既定]
    why: default の訳語。Microsoft 製品の文書では定着しているが、Web の技術文書ではデフォルトや初期値と書くことが多い。
    suggest: [デフォルト, 初期値, 何も指定しないとき]
    keep_when: [Microsoft 製品の用語（既定のブラウザ）, 法令]
    examples:
      - bad: 既定ではオフになっている。
        good: デフォルトではオフになっている。

  - id: jissoku
    term: 実測
    yomi: じっそく
    category: stiff-kango
    severity: info
    evidence: {survey: 2026-11, ai: 8.86, human2021: 0.37, qiita2026: 4.19, note: 'Qiita 7万件調査（nyosegawa, 2026-09）の記事割合 実測 0.1%→9.4%'}
    match:
      literal: [実測]
    why: 「実測では」のように、何をどの条件で測ったのかを書かずに数値の確かさだけを示す形が多い。
    suggest: [測定した値, 実際に測った, 〇〇の条件で測った]
    keep_when: [測量、測定の方法を説明するとき]
    examples:
      - bad: 実測では 1/7 になった。
        good: 手元のベンチで測ると、処理時間が 1/7 になった。

  - id: shisa
    term: 示唆
    yomi: しさ
    category: stiff-kango
    severity: info
    evidence: {survey: 2026-11, ai: 0.28, human2021: 0.21, qiita2026: 0.77}
    match:
      regex: ['示唆(する|し|さ|が|を|は|的)']
    why: 何を根拠に、どの程度そう言えるのかが書かれないまま、可能性だけを述べる形が多い。
    suggest: [〜と考えられる, 〜を示す, 〜の可能性がある]
    keep_when: [論文]
    examples:
      - bad: 同じ API を共有している可能性を示唆する。
        good: ログの形式が同じなので、同じ API を共有している可能性がある。

  - id: dantei
    term: 断定
    yomi: だんてい
