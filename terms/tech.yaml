  # ---- 比喩の修飾語（metaphor-modifier）----
  - id: nama
    term: 生の・生〇〇
    yomi: なまの
    category: metaphor-modifier
    severity: warn
    evidence: {survey: 2026-11, ai: 2.32, human2021: 0.55, qiita2026: 1.17}
    match:
      regex:
        - '(?<![一-龥々])生の'
        - '(?<![一-龥々])生(ログ|値|API|JSON|文字列|パス|バイト|出力|応答|レスポンス|テキスト|ファイル|ボディ|イベント|計測|結果|トークン|ヘッダ)'
      exclude: [生の声]
    why: raw の直訳。加工していないのか、検証していないのか、測ったままなのかが分からない。「生データ」「生 SQL」のように定着した言い方は、ほかに少ない。
    suggest: [加工していない, 元の, 測ったままの, 検証前の, 〇〇を通さない]
    keep_when: [生データ（定着した言い方）, 生 SQL（ORM を通さない SQL）, 生の声（利用者の意見）]
    examples:
      - bad: 最終日の生の計測から失点を数える。
        good: 最終日に測った値をそのまま使って、失点を数える。
      - bad: 生ログは各 worktree に残してある。
        good: 加工していないログは、各 worktree に残してある。
      - bad: 関数には生のパスを渡す。
        good: 関数には、正規化する前のパスを渡す。

