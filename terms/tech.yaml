# yaml-language-server: $schema=../schema/terms.schema.json
#
# 技術文書向けの語の一覧。
# 1件ごとに、検出に使う match と、言い換えを判断するための why / suggest / keep_when / examples を持つ。
# examples の bad は必ずその語に当たり、good は当たらないことを validate.py が確かめる。
# 語を足したら: uv run --script scripts/validate.py
#
# evidence は 10万字あたりの出現数（2026-11 の調査。research/2026-11-term-survey/README.md）。
#   ai: Claude Code の会話ログの Claude の文章 / human2021: Qiita の2021年8〜12月の記事 / qiita2026: Qiita の2026年の記事

version: 1
domain: tech
description: Web の技術記事、README、設計メモ、PR の説明など

categories:
  inflated-noun: 役割を大げさに呼ぶ名詞
  doc-structure: 文書の区切りの直訳
  metaphor-verb: 比喩の動詞
  calque: 英語の直訳語
  stiff-kango: 硬い漢語
  cliche: 評価の決まり文句
  structure-metaphor: 構造を体や建物にたとえる名詞
  metaphor-noun: 比喩の名詞
  metaphor-modifier: 比喩の修飾語

terms:
  # ---- 役割を大げさに呼ぶ名詞（inflated-noun）----
  - id: shohon
    term: 正本
    yomi: しょうほん
    category: inflated-noun
    severity: warn
    evidence: {survey: 2026-11, ai: 8.44, human2021: 0.0, qiita2026: 2.14, note: 'Qiita 7万件調査（nyosegawa, 2026-09）の記事割合 正本 0.0%→1.7%'}
    match:
      literal: [正本]
    why: 元のファイルや基準のデータを「正本」と呼ぶと、唯一の正しい版という含みが加わる。技術文書では一般的でない。
    suggest: [原本, 元のファイル, 基準にする（動詞で書き直す）, SSoT（読み手が知っている場合）]
    keep_when: [法律・登記・公文書の正式な用語として使うとき]
    examples:
      - bad: 設定はこの YAML を正本とする。
        good: 設定はこの YAML を基準にし、ほかのファイルはここから生成する。

  - id: daicho
    term: 台帳
    yomi: だいちょう
    category: inflated-noun
    severity: warn
    evidence: {survey: 2026-11, ai: 8.09, human2021: 0.0, qiita2026: 0.9}
    match:
      literal: [台帳]
    why: ただの一覧や表を「台帳」と呼ぶと、公的な記録のような重さが加わる。
    suggest: [一覧, 管理表, リスト]
    keep_when: [行政・会計の台帳（固定資産台帳など）]
    examples:
      - bad: 依存ライブラリの台帳を作る。
        good: 依存ライブラリの一覧を作る。

  - id: keiyaku
    term: 契約
    yomi: けいやく
    category: inflated-noun
    severity: warn
    evidence: {survey: 2026-11, ai: 12.24, human2021: 2.08, qiita2026: 13.33}
    match:
      literal: [契約]
      exclude: [契約書, 契約者, 契約期間, 利用契約, 契約更新, 契約プラン]
    why: API やモジュールの取り決めを「契約」と呼ぶのは contract の直訳。日本語の技術文書では仕様やインターフェースと書くことが多い。
    suggest: [仕様, インターフェース定義, 取り決め, 型, コントラクト（Design by Contract の文脈）]
    keep_when: [法的な契約, Design by Contract やコントラクトテストの説明で用語として使うとき]
    examples:
      - bad: この関数は入力が空でない契約になっている。
        good: この関数は空でない入力を受け取る前提で書かれている。

  - id: shireito
    term: 司令塔
    yomi: しれいとう
    category: inflated-noun
    severity: warn
    evidence: {survey: 2026-11, ai: 0.7, human2021: 0.0, qiita2026: 0.35}
    match:
      literal: [司令塔]
    why: 処理を呼び出す関数やサービスを人の役割にたとえている。何を呼び、何を決めるのかが書かれない。
    suggest: [全体を呼び出す処理, オーケストレーター, エントリーポイント]
    keep_when: []
    examples:
      - bad: この関数が司令塔になり、各処理を順に呼ぶ。
        good: この関数が各処理を順に呼ぶ。

  - id: gate
    term: ゲート
    category: inflated-noun
    severity: info
    evidence: {survey: 2026-11, ai: 1.83, human2021: 2.31, qiita2026: 4.04}
    match:
      literal: [ゲート]
      exclude: [ゲートウェイ, ゲートキーパー]
    why: 確認の段階を「ゲート」と呼ぶと、何を確かめて何を止めるのかが書かれないまま済んでしまう。
    suggest: [チェック, 確認, 必須チェック（CI）]
    keep_when: [品質ゲートのように定着した用語, ツールの機能名（Quality Gate など）]
    examples:
      - bad: レビューのゲートを通してからマージする。
        good: レビューで承認を受けてからマージする。

  - id: ichiji-joho
    term: 一次情報
    yomi: いちじじょうほう
    category: inflated-noun
    severity: info
    evidence: {survey: 2026-11, ai: 1.13, human2021: 0.05, qiita2026: 1.64}
    match:
      literal: [一次情報, 一次ソース]
    why: 公式ドキュメントを読むことを「一次情報にあたる」と大げさに言う形が多い。何を見たかを書けば足りる。
    suggest: [公式ドキュメント, 元の資料, リリースノート, ソースコード]
    keep_when: [調査報告で一次資料と二次資料を分けて扱うとき（「一次資料」は定着した語なので検出しない）]
    examples:
      - bad: 必ず一次情報にあたって確認すること。
        good: 必ず公式ドキュメントで確認すること。

  # ---- 文書の区切りの直訳（doc-structure）----
  - id: setsu
    term: 節
    yomi: せつ
    category: doc-structure
    severity: warn
    evidence: {survey: 2026-11, ai: 3.73, human2021: 1.06, qiita2026: 1.27}
    match:
      regex:
        - '(この|本|次の|前の|上の|下の|各|同|以下の|後の|別の|最後の)節'
        - '節(では|で|に|を|の内容|で述べ|を参照)'
      exclude: [季節, 節約, 調節, 関節, 節目, 節度, 節電, 節水, 節税, 使節, 文節, 音節, 節分, 時節, 礼節, 結節, 変節, 節穴, 節操]
      exclude_regex: ['第?[0-9０-９]+([.．][0-9０-９]+)*\s*節']
    why: 記事や README の区切りを「節」と呼ぶのは section の直訳。Web の技術文書では見出しやセクションと呼ぶことが多い。
    suggest: [セクション, 章, 項, 以下, この見出し]
    keep_when: [書籍・論文・仕様書で章節番号を振っているとき（RFC 9110 の 15.5 節 など）]
    examples:
      - bad: 詳細は次の節で説明する。
        good: 詳細は次のセクションで説明する。
      - bad: この節では設定方法を扱う。
        good: ここでは設定方法を扱う。

  - id: honko
    term: 本稿
    yomi: ほんこう
    category: doc-structure
    severity: warn
    evidence: {survey: 2026-11, ai: 0.0, human2021: 1.82, qiita2026: 1.82}
    match:
      literal: [本稿]
    why: 論文の言い方で、Web の記事や README では硬すぎる。
    suggest: [この記事, この文書, ここでは]
    keep_when: [論文, 学会誌の原稿]
    examples:
      - bad: 本稿では導入手順を扱う。
        good: この記事では導入手順を扱う。

  # ---- 比喩の動詞（metaphor-verb）----
  - id: yoseru
    term: 寄せる
    yomi: よせる
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 4.36, human2021: 0.37, qiita2026: 2.47}
    match:
      regex: ['寄せ(る|て|た|ます|ました|られ|れば|よう|ない|ず)']
      exclude: [取り寄せ, 押し寄せ, 引き寄せ, 呼び寄せ, 寄せ書き, 関心を寄せ, 期待を寄せ, 意見を寄せ, 心を寄せ, 身を寄せ, 問い合わせ]
    why: 「1か所に寄せる」「実装を寄せる」は、まとめるのか、合わせるのか、移すのかが分からない。
    suggest: [まとめる, 統一する, 合わせる, 移す]
    keep_when: []
    examples:
      - bad: 設定を1か所に寄せる。
        good: 設定を1つのファイルにまとめる。

  - id: nigiru
    term: 握る
    yomi: にぎる
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.0, human2021: 0.0, qiita2026: 0.02}
    match:
      regex: ['(仕様|要件|方針|期日|スケジュール|インターフェース|スコープ|前提)を(先に|事前に|最初に)?握(る|り|っ|ら|れ)']
    why: 合意を「握る」と言う俗語。誰と何を決めたのかが書かれない。
    suggest: [合意する, 決める, すり合わせる]
    keep_when: []
    examples:
      - bad: 実装の前に仕様を握っておく。
        good: 実装の前にチームで仕様を決めておく。

  - id: hagasu
    term: 剥がす
    yomi: はがす
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.35, human2021: 0.09, qiita2026: 0.12}
    match:
      regex: ['剥が(す|し|さ|せ|そ)', 'はが(す|して|した|せる)']
      exclude: [はがき, 引き剥が, 引きはが]
    why: 依存や層を「剥がす」は、削除するのか、別のモジュールに分けるのかが曖昧になる。
    suggest: [外す, 取り除く, 分離する]
    keep_when: [シールや塗装など物理的に剥がすとき]
    examples:
      - bad: 古いライブラリへの依存を剥がす。
        good: 古いライブラリへの依存を取り除く。

  - id: kamaseru
    term: 噛ませる
    yomi: かませる
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.0, human2021: 0.14, qiita2026: 0.12}
    match:
      regex: ['噛ま(せ|す|し)', 'かませ(る|て|た|ます|れば)']
    why: 間に処理を「噛ませる」は口語。どこに何を挟むかを書いたほうが伝わる。
    suggest: [挟む, 経由させる, 間に入れる]
    keep_when: []
    examples:
      - bad: API の前にプロキシを噛ませる。
        good: API の前にプロキシを置き、リクエストを経由させる。

  - id: chakuchi
    term: 着地
    yomi: ちゃくち
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.14, human2021: 0.05, qiita2026: 0.52}
    match:
      literal: [着地]
    why: 作業や議論の終わり方を「着地」とたとえる言い方。完了なのか、マージなのか、結論なのかが分からない。
    suggest: [完了する, マージする, 結論を出す, 決まる]
    keep_when: [物理的な着地（ドローンなど）]
    examples:
      - bad: 今週中に着地させたい。
        good: 今週中にマージしたい。

  - id: tabaneru
    term: 束ねる
    yomi: たばねる
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.77, human2021: 0.09, qiita2026: 0.6}
    match:
      regex: ['束ね(る|て|た|ます|ました|られ)']
    why: 設定や処理を「束ねる」は、まとめ方（1ファイルにする、1関数にする）が書かれない。
    suggest: [まとめる, 1つにする]
    keep_when: []
    examples:
      - bad: 環境ごとの設定を束ねる。
        good: 環境ごとの設定を1つのファイルにまとめる。

  - id: kyushu
    term: 吸収する
    yomi: きゅうしゅう
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.42, human2021: 0.71, qiita2026: 0.87}
    match:
      regex: ['吸収(する|し|さ|でき|させ)']
      exclude: [吸収合併, 衝撃を吸収, 水分を吸収, 熱を吸収, 光を吸収, 栄養を吸収]
    why: 違いを「吸収する」は、何がどう変換されて呼び出し側から見えなくなるのかが書かれない。
    suggest: [〜で差を埋める, 〜で変換する, 〜で対応する]
    keep_when: []
    examples:
      - bad: OS ごとの差分はアダプタで吸収する。
        good: OS ごとのパスの書き方の違いはアダプタで変換する。

  - id: taosu
    term: 倒す
    yomi: たおす
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.28, human2021: 0.07, qiita2026: 0.35, note: 'Qiita 7万件調査（nyosegawa, 2026-09）の記事割合 倒す 0.2%→1.1%'}
    match:
      regex: ['に倒(す|し|さ|せ|そ)']
    why: 設定値を「true に倒す」は口語。有効にするのか、値を設定するのかを書けば足りる。
    suggest: [有効にする, 無効にする, 〜に設定する]
    keep_when: []
    examples:
      - bad: フラグを true に倒す。
        good: フラグを true に設定する。

  - id: hayasu
    term: 生やす
    yomi: はやす
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.14, human2021: 0.78, qiita2026: 0.32}
    match:
      regex: ['生や(す|し|さ|せ|そ)']
      exclude: [ひげを生や, 髭を生や]
    why: エンドポイントやメソッドを「生やす」は口語。追加すると書けば足りる。
    suggest: [追加する, 作る, 定義する]
    keep_when: []
    examples:
      - bad: 管理用のエンドポイントを生やす。
        good: 管理用のエンドポイントを追加する。

  - id: ochiru
    term: 落ちる
    yomi: おちる
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 20.54, human2021: 3.11, qiita2026: 6.9}
    match:
      regex: ['落ち(る|た|て|ます|ました|ない|なく|やすい|れば|ず)']
      exclude: [落ち着, 落ち込, 落ち度, 落ち合, 気落ち, 落ち葉, 抜け落ち]
    why: サーバーやテストが「落ちる」は口語。停止したのか、異常終了したのか、失敗したのかが分からない。数値が「落ちる」も、どこまで下がったのかが書かれないことが多い。
    suggest: [停止する, 異常終了する, 失敗する, 応答しなくなる, 下がる（数値のとき）]
    keep_when: [物理的に落ちるとき]
    examples:
      - bad: 負荷が高いとサーバーが落ちる。
        good: 負荷が高いとサーバーが応答しなくなる。
      - bad: CI でテストが落ちた。
        good: CI でテストが失敗した。

  - id: kuzureru
    term: 崩れる
    yomi: くずれる
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 7.81, human2021: 0.3, qiita2026: 2.24}
    match:
      regex: ['崩れ(る|て|た|ま|ない|なかった|やす)']
      exclude: [荷崩れ, 土砂崩れ, 崖崩れ, 煮崩れ, 型崩れ]
      exclude_regex: ['(表示|レイアウト|画面|デザイン|体調|天気|天候)が崩れ']
    why: 何がどう悪くなったのかを「崩れる」でまとめている。点数が下がったのか、前提が成り立たなくなったのか、失敗したのかが分からない。
    suggest: [下がる, 成り立たなくなる, 失敗する, 当てはまらなくなる]
    keep_when: [表示やレイアウトが崩れる]
    examples:
      - bad: 5 日目は崩れませんでした。
        good: 5 日目は点数が下がりませんでした。

  - id: kiku
    term: 効く
    yomi: きく
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 4.5, human2021: 0.12, qiita2026: 3.19, note: 'Qiita 7万件調査（nyosegawa, 2026-09）の記事割合 効く 2.0%→22.3%'}
    match:
      regex: ['(一番|いちばん|最も|特に|ここで|そこで|地味に|じわじわ|大きく)効(く|いて|き|いた)', '効いてくる', '効き目']
    why: 何がどう良くなるのかを「効く」で済ませている。英語の what matters や pay off を写した言い方のことも多い。
    suggest: [効果がある, 大事なのは, 速くなる, 〇〇が減る]
    keep_when: [キャッシュが効く、薬が効くのような定着した言い方]
    examples:
      - bad: ここで効いてくるのが、名前の付け方です。
        good: ここで大事なのは、名前の付け方です。

  - id: nigasu
    term: 逃がす
    yomi: にがす
    category: metaphor-verb
    severity: warn
    evidence: {survey: 2026-11, ai: 0.56, human2021: 0.0, qiita2026: 0.9}
    match:
      regex: ['逃が(す|し|さ|せ)']
      exclude: [熱を逃が, 取り逃が, 見逃]
    why: 処理を別の場所へ「逃がす」は、移すのか、振り分けるのかが分からない。
    suggest: [移す, 振り分ける, 別のサーバーで処理する]
    keep_when: [熱や湿気を逃がす]
    examples:
      - bad: ログインの処理を別サーバーに逃がす。
        good: ログインの処理を別のサーバーに移す。

  - id: mawasu
    term: 回す
    yomi: まわす
    category: metaphor-verb
    severity: info
    evidence: {survey: 2026-11, ai: 11.54, human2021: 0.18, qiita2026: 1.22}
    match:
      regex: ['(テスト|CI|ジョブ|ループ|処理|ベンチ|検査|計測|測定|バッチ|PDCA|サイクル)を(回|まわ)(す|し|さ|せ)']
    why: 実行するのか、繰り返すのかが分からない。
    suggest: [実行する, 繰り返す, 定期的に実行する]
    keep_when: []
    examples:
      - bad: 再起動の検査を回している。
        good: 再起動の検査を実行している。

  - id: hashiraseru
    term: 走らせる
    yomi: はしらせる
    category: metaphor-verb
    severity: info
    evidence: {survey: 2026-11, ai: 4.36, human2021: 0.42, qiita2026: 3.29}
    match:
      regex: ['走らせ']
    why: 実行することを走るにたとえている。
    suggest: [実行する, 動かす]
    keep_when: []
    examples:
      - bad: 負荷試験を走らせる。
        good: 負荷試験を実行する。

  - id: tsumaru
    term: 詰まる
    yomi: つまる
    category: metaphor-verb
    severity: info
    evidence: {survey: 2026-11, ai: 5.84, human2021: 0.55, qiita2026: 1.57}
    match:
      regex: ['(が|で)詰ま(る|り|っ)', '詰まりどころ']
    why: 止まったのか、遅くなったのか、何が待たされているのかが分からない。
    suggest: [止まる, 遅くなる, 待たされる, 進まなくなる]
    keep_when: [配管や紙が物理的に詰まるとき]
    examples:
      - bad: 書き込みが詰まっている。
        good: 書き込みがロックの解放を待っている。

  - id: kowareru
    term: 壊れる
    yomi: こわれる
    category: metaphor-verb
    severity: info
    evidence: {survey: 2026-11, ai: 7.6, human2021: 0.78, qiita2026: 5.63, note: 'Qiita 7万件調査（nyosegawa, 2026-09）の記事割合 壊れる 0.8%→13.1%'}
    match:
      regex: ['壊れ(る|て|た|ま|ない|なかった|やす)']
      exclude_regex: ['(画面|機械|端末|ディスク|HDD|SSD|PC|パソコン)が壊れ']
